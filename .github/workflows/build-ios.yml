name: Build iOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project TuffTest.xcodeproj \
            -scheme TuffTest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/TuffTest.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -r "$GITHUB_WORKSPACE/tuff-test.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: tuff-test-ipa
          path: tuff-test.ipa
